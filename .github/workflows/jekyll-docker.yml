name: Jekyll site CI

on:
  push:
    branches: [ "Apostles-Enterprise-pages" ]
  pull_request:
    branches: [ "Apostles-Enterprise-pages" ]

jobs:
  build:
[![Jekyll site CI](https://github.com/Apostles1/crown_delegate/actions/workflows/jekyll-docker.yml/badge.svg?event=workflow_run)](https://github.com/Apostles1/crown_delegate/actions/workflows/jekyll-docker.yml)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the site in the jekyll/builder container
      run: |
        docker run \
        -v ${{ github.workspace }}:/srv/jekyll -v ${{ github.workspace }}/_site:/srv/jekyll/_site \
        jekyll/builder:latest /bin/bash -c "chmod -R 777 /srv/jekyll && jekyll build --future"
